
name: MediCall AI - SonarQube Community

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar-analysis:
    name: Analyze Python Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Python syntax check
        run: python3 -m compileall -q backend

      - name: Validate SonarQube configuration
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_HOST_URL" ]; then
            echo "Error: SONAR_HOST_URL secret is missing"
            exit 1
          fi

          if [ -z "$SONAR_TOKEN" ]; then
            echo "Error: SONAR_TOKEN secret is missing"
            exit 1
          fi

          case "$SONAR_HOST_URL" in
            http://*|https://*) ;;
            *)
              echo "Error: SONAR_HOST_URL must start with http:// or https://"
              exit 1
              ;;
          esac

      - name: SonarQube Community scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=medicall_ai_old
            -Dsonar.sources=backend
            -Dsonar.sourceEncoding=UTF-8
