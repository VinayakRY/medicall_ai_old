name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Check SonarQube connectivity
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_HOST_URL" ]; then
            echo "::error::SONAR_HOST_URL secret is missing."
            exit 1
          fi

          echo "Checking SonarQube server..."
          curl -sS -L \
            --connect-timeout 10 \
            --max-time 20 \
            -o /dev/null \
            -w "HTTP status: %{http_code}\n" \
            "${SONAR_HOST_URL%/}/api/v2/analysis/version" || {
              echo "::error::Cannot connect to SonarQube. Check the URL, network, and TLS certificate."
              exit 1
            }

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
